name: dpp-lca
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  # LCA engine
  - brightway2=2.4.6          # pulls bw2data 3.6.x, bw2calc 1.8.x, bw2io 0.8.x
  - activity-browser=2.11.2   # GUI used for the Monte Carlo runs (last bw2-based release)
  # data handling
  - numpy<2                   # required by brightway2 2.4.x
  - pandas>=2.2
  - openpyxl                  # read/write the SI Excel files
  # figures and interactive work
  - matplotlib
  - ipykernel                 # run the '# %%' cells in VS Code / Spyder / Jupyter
  - pip
